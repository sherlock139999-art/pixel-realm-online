<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#233c30"><title>像素冒險世界 Online</title><style>*{box-sizing:border-box;touch-action:none}html,body{margin:0;overflow:hidden;background:#192e27;color:white;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}#hud{position:fixed;top:10px;left:10px;background:#14241dcc;padding:9px 13px;border-radius:10px;font-size:13px;pointer-events:none}#online{position:fixed;right:12px;top:10px;background:#14241dcc;padding:8px;border-radius:8px;font-size:12px}#stick{position:fixed;bottom:18px;left:22px;width:112px;height:112px;border-radius:50%;background:#1a312b99;border:2px solid #e8e8ce77;display:grid;place-items:center}#nub{width:45px;height:45px;border-radius:50%;background:#d6e7d8aa}#skill{position:fixed;right:25px;bottom:30px;width:80px;height:80px;border-radius:50%;border:3px solid #e8cd9d;background:#9d513d;color:white;font-size:30px}#login{position:fixed;inset:0;background:#14291eea;display:grid;place-items:center}#panel{padding:25px;border-radius:18px;background:#355743;text-align:center;max-width:90vw}input,button{font:inherit}input{padding:12px;border-radius:8px;border:0;max-width:100%}#go{margin-top:12px;padding:10px 25px;border:0;border-radius:9px;background:#e9c37c;font-weight:bold}#status{font-size:12px;color:#f3d4a2;margin-top:8px}</style></head><body><canvas id="game"></canvas><div id="hud">連線中…</div><div id="online">在線 0</div><div id="stick"><div id="nub"></div></div><button id="skill" aria-label="範圍技能">✦</button><div id="login"><div id="panel"><h2>🌿 像素冒險世界</h2><p>多人共享地圖 · 自動攻擊 · 範圍技能</p><input id="name" maxlength="14" placeholder="輸入冒險者名稱" value="冒險者"><br><button id="go">進入世界</button><div id="status">等待開始</div></div></div><script src="game.js"></script></body></html>
